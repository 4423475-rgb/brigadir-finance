<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRIGADIR FINANCE</title>
  <meta name="theme-color" content="#0b1220">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: #f4f7fb;
    }
    .app { max-width: 760px; margin: 0 auto; }
    h1 { margin: 8px 0 24px; text-align: center; letter-spacing: 2px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .card, .panel {
      background: #172235;
      border: 1px solid #26364f;
      border-radius: 14px;
      padding: 15px;
    }
    .card span { display: block; color: #aab8ca; font-size: 12px; margin-bottom: 8px; }
    .card strong { font-size: 19px; overflow-wrap: anywhere; }
    .income { color: #4ade80; }
    .expense { color: #fb7185; }
    h2 { font-size: 18px; margin: 0 0 15px; }
    label { display: block; margin: 12px 0 6px; color: #c5d0df; font-size: 14px; }
    input, select, button {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 12px;
      font-size: 16px;
    }
    input, select { background: #0e192b; color: white; border: 1px solid #34445d; }
    button { margin-top: 16px; background: #3b82f6; color: white; font-weight: bold; }
    button:active { opacity: .8; }
    .operation {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #2b3a50;
    }
    .operation:last-child { border-bottom: 0; }
    .details { min-width: 0; }
    .details strong, .details small { display: block; overflow-wrap: anywhere; }
    .details small { color: #aab8ca; margin-top: 4px; }
    .right { text-align: right; white-space: nowrap; }
    .delete {
      width: auto;
      margin: 7px 0 0;
      padding: 6px 9px;
      font-size: 12px;
      background: #653044;
    }
    .empty { color: #aab8ca; text-align: center; padding: 18px 0; }
    @media (max-width: 430px) {
      body { padding: 12px; }
      .cards { gap: 6px; }
      .card { padding: 10px 8px; }
      .card strong { font-size: 15px; }
      .card span { font-size: 11px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>BRIGADIR FINANCE</h1>

    <section class="cards">
      <div class="card">
        <span>Доход</span>
        <strong class="income" id="totalIncome">0 ₴</strong>
      </div>
      <div class="card">
        <span>Расход</span>
        <strong class="expense" id="totalExpenses">0 ₴</strong>
      </div>
      <div class="card">
        <span>Баланс</span>
        <strong id="balance">0 ₴</strong>
      </div>
    </section>

    <section class="panel">
      <h2>Новая операция</h2>

      <label for="type">Тип операции</label>
      <select id="type">
        <option value="income">Доход</option>
        <option value="expense">Расход</option>
      </select>

      <label for="category">Категория</label>
      <select id="category">
        <option>Работа</option>
        <option>Материалы</option>
        <option>Инструменты</option>
        <option>Зарплата</option>
        <option>Аванс</option>
        <option>Другое</option>
      </select>

      <label for="description">Описание</label>
      <input id="description" type="text" placeholder="Например: оплата за объект">

      <label for="amount">Сумма, ₴</label>
      <input id="amount" type="number" min="0.01" step="0.01" placeholder="Введите сумму">

      <button id="addButton" type="button">Добавить операцию</button>
    </section>

    <section class="panel" style="margin-top: 18px;">
      <h2>История операций</h2>
      <label for="historyFilter">Показать</label>
      <select id="historyFilter">
        <option value="all">Все операции</option>
        <option value="income">Только доходы</option>
        <option value="expense">Только расходы</option>
      </select>
      <div id="history"></div>
    </section>
  </main>

  <script>
    let operations = JSON.parse(localStorage.getItem("brigadirOperations") || "[]");

    function saveData() {
      localStorage.setItem("brigadirOperations", JSON.stringify(operations));
    }

    function addOperation() {
      const type = document.getElementById("type").value;
      const category = document.getElementById("category").value;
      const description = document.getElementById("description").value.trim();
      const amount = Number(document.getElementById("amount").value);

      if (!description || !Number.isFinite(amount) || amount <= 0) {
        alert("Заполни описание и введи сумму больше нуля.");
        return;
      }

      operations.push({
        type: type,
        category: category,
        description: description,
        amount: amount,
        date: new Date().toLocaleDateString("ru-RU")
      });

      saveData();
      document.getElementById("description").value = "";
      document.getElementById("amount").value = "";
      updateScreen();
    }

    function deleteOperation(index) {
      if (!confirm("Удалить эту операцию?")) return;
      operations.splice(index, 1);
      saveData();
      updateScreen();
    }

    function updateScreen() {
      let income = 0;
      let expenses = 0;

      operations.forEach(function(operation) {
        if (operation.type === "income") {
          income += operation.amount;
        } else {
          expenses += operation.amount;
        }
      });

      document.getElementById("totalIncome").textContent =
        income.toLocaleString("ru-RU") + " ₴";
      document.getElementById("totalExpenses").textContent =
        expenses.toLocaleString("ru-RU") + " ₴";

      const balance = income - expenses;
      const balanceElement = document.getElementById("balance");
      balanceElement.textContent = balance.toLocaleString("ru-RU") + " ₴";
      balanceElement.className = balance >= 0 ? "income" : "expense";

      const history = document.getElementById("history");
      history.replaceChildren();

      if (operations.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Пока операций нет";
        history.appendChild(empty);
        return;
      }

      const filter = document.getElementById("historyFilter").value;
      const visibleOperations = operations
        .map(function(operation, index) { return { operation: operation, index: index }; })
        .filter(function(item) { return filter === "all" || item.operation.type === filter; });

      if (visibleOperations.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Операций этого типа пока нет";
        history.appendChild(empty);
        return;
      }

      visibleOperations.forEach(function(item) {
        const operation = item.operation;
        const index = item.index;
        const row = document.createElement("div");
        row.className = "operation";

        const details = document.createElement("div");
        details.className = "details";

        const title = document.createElement("strong");
        title.textContent = operation.description;

        const subtitle = document.createElement("small");
        subtitle.textContent = operation.category + " • " + operation.date;

        details.appendChild(title);
        details.appendChild(subtitle);

        const right = document.createElement("div");
        right.className = "right";

        const amount = document.createElement("strong");
        amount.className = operation.type === "income" ? "income" : "expense";
        amount.textContent =
          (operation.type === "income" ? "+" : "−") +
          operation.amount.toLocaleString("ru-RU") + " ₴";

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete";
        deleteButton.textContent = "Удалить";
        deleteButton.type = "button";
        deleteButton.addEventListener("click", function() {
          deleteOperation(index);
        });

        right.appendChild(amount);
        right.appendChild(deleteButton);
        row.appendChild(details);
        row.appendChild(right);
        history.appendChild(row);
      });
    }

    document.getElementById("addButton").addEventListener("click", addOperation);
    document.getElementById("historyFilter").addEventListener("change", updateScreen);
    updateScreen();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("./sw.js").catch(function(error) {
          console.log("Service worker registration failed:", error);
        });
      });
    }
  </script>
</body>
</html>
