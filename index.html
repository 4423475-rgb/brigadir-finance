<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRIGADIR FINANCE</title>
  <meta name="theme-color" content="#0b1220">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; padding:20px; font-family:Arial,sans-serif; background:#0b1220; color:#f4f7fb; }
    .app { max-width:760px; margin:0 auto; }
    h1 { margin:8px 0 18px; text-align:center; letter-spacing:2px; }
    .topbar { display:flex; justify-content:flex-end; margin-bottom:14px; }
    .topbar select { width:auto; min-width:145px; }
    .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px; }
    .card,.panel { background:#172235; border:1px solid #26364f; border-radius:14px; padding:15px; }
    .card span { display:block; color:#aab8ca; font-size:12px; margin-bottom:8px; }
    .card strong { font-size:19px; overflow-wrap:anywhere; }
    .income { color:#4ade80; } .expense { color:#fb7185; }
    h2 { font-size:18px; margin:0 0 15px; }
    label { display:block; margin:12px 0 6px; color:#c5d0df; font-size:14px; }
    input,select,button { width:100%; border:0; border-radius:9px; padding:12px; font-size:16px; }
    input,select { background:#0e192b; color:white; border:1px solid #34445d; }
    button { margin-top:16px; background:#3b82f6; color:white; font-weight:bold; }
    button:active { opacity:.8; }
    .operation { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid #2b3a50; }
    .operation:last-child { border-bottom:0; }
    .details { min-width:0; }
    .details strong,.details small { display:block; overflow-wrap:anywhere; }
    .details small { color:#aab8ca; margin-top:4px; }
    .right { text-align:right; white-space:nowrap; }
    .delete { width:auto; margin:7px 0 0; padding:6px 9px; font-size:12px; background:#653044; }
    .empty { color:#aab8ca; text-align:center; padding:18px 0; }
    @media(max-width:430px) { body{padding:12px} .cards{gap:6px} .card{padding:10px 8px} .card strong{font-size:15px} .card span{font-size:11px} }
  </style>
</head>
<body>
<main class="app">
  <h1>BRIGADIR FINANCE</h1>
  <div class="topbar">
    <select id="language" aria-label="Language">
      <option value="uk">🇺🇦 Українська</option>
      <option value="ru">🇷🇺 Русский</option>
      <option value="en">🇬🇧 English</option>
      <option value="de">🇩🇪 Deutsch</option>
    </select>
  </div>
  <section class="cards">
    <div class="card"><span data-i18n="income">Дохід</span><strong class="income" id="totalIncome">0 ₴</strong></div>
    <div class="card"><span data-i18n="expenses">Витрати</span><strong class="expense" id="totalExpenses">0 ₴</strong></div>
    <div class="card"><span data-i18n="balance">Баланс</span><strong id="balance">0 ₴</strong></div>
  </section>
  <section class="panel">
    <h2 data-i18n="newOperation">Нова операція</h2>
    <label for="type" data-i18n="operationType">Тип операції</label>
    <select id="type">
      <option value="income" data-i18n="income">Дохід</option>
      <option value="expense" data-i18n="expenses">Витрати</option>
    </select>
    <label for="category" data-i18n="category">Категорія</label>
    <select id="category">
      <option value="work" data-i18n="work">Робота</option>
      <option value="materials" data-i18n="materials">Матеріали</option>
      <option value="tools" data-i18n="tools">Інструменти</option>
      <option value="salary" data-i18n="salary">Зарплата</option>
      <option value="advance" data-i18n="advance">Аванс</option>
      <option value="other" data-i18n="other">Інше</option>
    </select>
    <label for="description" data-i18n="description">Опис</label>
    <input id="description" type="text" data-i18n-placeholder="descriptionPlaceholder" placeholder="Наприклад: оплата за об'єкт">
    <label for="amount" data-i18n="amount">Сума, ₴</label>
    <input id="amount" type="number" min="0.01" step="0.01" data-i18n-placeholder="amountPlaceholder" placeholder="Введіть суму">
    <button id="addButton" type="button" data-i18n="addOperation">Додати операцію</button>
  </section>
  <section class="panel" style="margin-top:18px">
    <h2 data-i18n="history">Історія операцій</h2>
    <label for="historyFilter" data-i18n="show">Показати</label>
    <select id="historyFilter">
      <option value="all" data-i18n="allOperations">Усі операції</option>
      <option value="income" data-i18n="onlyIncome">Тільки доходи</option>
      <option value="expense" data-i18n="onlyExpenses">Тільки витрати</option>
    </select>
    <div id="history"></div>
  </section>
</main>
<script>
const translations = {
 uk:{income:"Дохід",expenses:"Витрати",balance:"Баланс",newOperation:"Нова операція",operationType:"Тип операції",category:"Категорія",work:"Робота",materials:"Матеріали",tools:"Інструменти",salary:"Зарплата",advance:"Аванс",other:"Інше",description:"Опис",descriptionPlaceholder:"Наприклад: оплата за об'єкт",amount:"Сума, ₴",amountPlaceholder:"Введіть суму",addOperation:"Додати операцію",history:"Історія операцій",show:"Показати",allOperations:"Усі операції",onlyIncome:"Тільки доходи",onlyExpenses:"Тільки витрати",empty:"Операцій поки немає",emptyFiltered:"Операцій цього типу поки немає",delete:"Видалити",confirmDelete:"Видалити цю операцію?",validation:"Заповніть опис і введіть суму більшу за нуль."},
 ru:{income:"Доход",expenses:"Расходы",balance:"Баланс",newOperation:"Новая операция",operationType:"Тип операции",category:"Категория",work:"Работа",materials:"Материалы",tools:"Инструменты",salary:"Зарплата",advance:"Аванс",other:"Другое",description:"Описание",descriptionPlaceholder:"Например: оплата за объект",amount:"Сумма, ₴",amountPlaceholder:"Введите сумму",addOperation:"Добавить операцию",history:"История операций",show:"Показать",allOperations:"Все операции",onlyIncome:"Только доходы",onlyExpenses:"Только расходы",empty:"Пока операций нет",emptyFiltered:"Операций этого типа пока нет",delete:"Удалить",confirmDelete:"Удалить эту операцию?",validation:"Заполните описание и введите сумму больше нуля."},
 en:{income:"Income",expenses:"Expenses",balance:"Balance",newOperation:"New transaction",operationType:"Transaction type",category:"Category",work:"Work",materials:"Materials",tools:"Tools",salary:"Salary",advance:"Advance",other:"Other",description:"Description",descriptionPlaceholder:"For example: payment for a project",amount:"Amount, ₴",amountPlaceholder:"Enter amount",addOperation:"Add transaction",history:"Transaction history",show:"Show",allOperations:"All transactions",onlyIncome:"Income only",onlyExpenses:"Expenses only",empty:"No transactions yet",emptyFiltered:"No transactions of this type yet",delete:"Delete",confirmDelete:"Delete this transaction?",validation:"Enter a description and an amount greater than zero."},
 de:{income:"Einnahmen",expenses:"Ausgaben",balance:"Kontostand",newOperation:"Neue Buchung",operationType:"Buchungstyp",category:"Kategorie",work:"Arbeit",materials:"Materialien",tools:"Werkzeuge",salary:"Gehalt",advance:"Vorschuss",other:"Sonstiges",description:"Beschreibung",descriptionPlaceholder:"Zum Beispiel: Zahlung für ein Objekt",amount:"Betrag, ₴",amountPlaceholder:"Betrag eingeben",addOperation:"Buchung hinzufügen",history:"Buchungsverlauf",show:"Anzeigen",allOperations:"Alle Buchungen",onlyIncome:"Nur Einnahmen",onlyExpenses:"Nur Ausgaben",empty:"Noch keine Buchungen",emptyFiltered:"Keine Buchungen dieses Typs",delete:"Löschen",confirmDelete:"Diese Buchung löschen?",validation:"Beschreibung und einen Betrag größer als null eingeben."}
};
let language = localStorage.getItem("brigadirLanguage") || "uk";
let operations = JSON.parse(localStorage.getItem("brigadirOperations") || "[]");
const $ = id => document.getElementById(id);
function t(key){return translations[language][key] || translations.uk[key] || key;}
function saveData(){localStorage.setItem("brigadirOperations",JSON.stringify(operations));}
function applyLanguage(){
  document.documentElement.lang=language;
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=t(el.dataset.i18n);});
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>{el.placeholder=t(el.dataset.i18nPlaceholder);});
  $("language").value=language;
  updateScreen();
}
function addOperation(){
  const type=$("type").value, category=$("category").value, description=$("description").value.trim(), amount=Number($("amount").value);
  if(!description || !Number.isFinite(amount) || amount<=0){alert(t("validation"));return;}
  operations.push({type,category,description,amount,date:new Date().toLocaleDateString(language==="en"?"en-GB":language==="de"?"de-DE":language==="ru"?"ru-RU":"uk-UA")});
  saveData(); $("description").value=""; $("amount").value=""; updateScreen();
}
function deleteOperation(index){if(!confirm(t("confirmDelete")))return;operations.splice(index,1);saveData();updateScreen();}
function updateScreen(){
  let income=0,expenses=0;
  operations.forEach(op=>{if(op.type==="income")income+=Number(op.amount)||0;else expenses+=Number(op.amount)||0;});
  const locale={uk:"uk-UA",ru:"ru-RU",en:"en-GB",de:"de-DE"}[language];
  $("totalIncome").textContent=income.toLocaleString(locale)+" ₴";
  $("totalExpenses").textContent=expenses.toLocaleString(locale)+" ₴";
  const balance=income-expenses; $("balance").textContent=balance.toLocaleString(locale)+" ₴"; $("balance").className=balance>=0?"income":"expense";
  const history=$("history"); history.replaceChildren();
  if(operations.length===0){const empty=document.createElement("div");empty.className="empty";empty.textContent=t("empty");history.appendChild(empty);return;}
  const filter=$("historyFilter").value;
  const visible=operations.map((operation,index)=>({operation,index})).filter(item=>filter==="all"||item.operation.type===filter);
  if(!visible.length){const empty=document.createElement("div");empty.className="empty";empty.textContent=t("emptyFiltered");history.appendChild(empty);return;}
  visible.forEach(({operation,index})=>{
    const row=document.createElement("div");row.className="operation";
    const details=document.createElement("div");details.className="details";
    const title=document.createElement("strong");title.textContent=operation.description;
    const subtitle=document.createElement("small");subtitle.textContent=t(operation.category)+" • "+operation.date;
    details.append(title,subtitle);
    const right=document.createElement("div");right.className="right";
    const amount=document.createElement("strong");amount.className=operation.type==="income"?"income":"expense";
    amount.textContent=(operation.type==="income"?"+":"−")+(Number(operation.amount)||0).toLocaleString(locale)+" ₴";
    const del=document.createElement("button");del.className="delete";del.type="button";del.textContent=t("delete");del.addEventListener("click",()=>deleteOperation(index));
    right.append(amount,del);row.append(details,right);history.appendChild(row);
  });
}
$("language").addEventListener("change",e=>{language=e.target.value;localStorage.setItem("brigadirLanguage",language);applyLanguage();});
$("addButton").addEventListener("click",addOperation);
$("historyFilter").addEventListener("change",updateScreen);
applyLanguage();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(error=>console.log("Service worker registration failed:",error)));}
</script>
</body>
</html>
